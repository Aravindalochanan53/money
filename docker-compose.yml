services:
  postgres:
    image: postgres:16-alpine
    container_name: flowcred-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowcred}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowcred_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-flowcred}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowcred} -d ${POSTGRES_DB:-flowcred}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: flowcred_postgres_data
